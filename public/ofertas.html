<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofertas | RA Achadinhos</title>
    <meta name="description" content="Explore ofertas por categoria, faixa de preço e loja." />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand"><span class="brand-mark">RA</span><span class="brand-text">Achadinhos</span></a>
        <nav class="main-nav">
          <a href="/categorias">Categorias</a>
          <a href="/ofertas">Ofertas</a>
          <a href="/favoritos">Favoritos</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container page-layout">
        <aside class="filters-panel">
          <h2>Filtros</h2>
          <label>
            Busca
            <input type="search" data-offers-search placeholder="Ex.: teclado" />
          </label>
          <label>
            Categoria
            <select data-filter-category>
              <option value="">Todas</option>
            </select>
          </label>
          <label>
            Preço máximo
            <select data-filter-price>
              <option value="">Qualquer</option>
              <option value="100">Até R$ 100</option>
              <option value="200">Até R$ 200</option>
              <option value="400">Até R$ 400</option>
            </select>
          </label>
          <label>
            Loja
            <select data-filter-store>
              <option value="">Todas</option>
              <option value="Shopee">Shopee</option>
            </select>
          </label>
          <label>
            Ordenar por
            <select data-filter-sort>
              <option value="relevance">Relevância</option>
              <option value="lowest_price">Menor preço</option>
              <option value="highest_price">Maior preço</option>
              <option value="newest">Mais recentes</option>
              <option value="most_accessed">Mais acessados</option>
            </select>
          </label>
        </aside>

        <section class="catalog-panel">
          <div class="section-header">
            <h1>Ofertas em destaque</h1>
            <p data-offers-summary>Carregando ofertas...</p>
          </div>
          <div class="product-grid" data-offer-grid></div>
        </section>
      </div>
    </main>

    <script type="module" src="/js/offers.js"></script>
  </body>
</html>
